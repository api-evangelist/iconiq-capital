aid: iconiq-capital
name: ICONIQ Capital
description: >-
  ICONIQ Capital is a global investment firm founded in December 2011 by Divesh
  Makan, Michael Anders, and Chad Boeding, headquartered in San Francisco,
  California with offices in Palo Alto, New York, London, and Singapore. ICONIQ
  operates as a hybrid family office and multi-strategy investment firm serving
  ultra-high-net-worth technology entrepreneurs, executives, and their families,
  and reports over $100B in assets under management across investment management,
  real assets, venture and growth, and impact strategies. Its venture arm, ICONIQ
  Growth, partners with founders from inception through IPO and beyond, backing
  category-leading technology companies across enterprise software,
  infrastructure, data, developer tools, fintech, security, healthcare IT, and —
  since 2023 — artificial intelligence as a core theme. ICONIQ Growth has invested
  in 140+ companies and produced notable outcomes including Snowflake, Airbnb,
  GitLab, HashiCorp, Datadog, Docusign, Adyen, Uber, Zoom, and Procore, alongside
  active AI positions in Anthropic, OpenAI, Writer, Glean, ElevenLabs, and Sierra.
